# Real Postgres + S3 (MinIO) for testing the production drivers on this PC. Not for production.
#   docker compose -f docker-compose.dev.yml up -d
#   E2E_REAL=1 DATABASE_URL=postgres://doctyn:doctyn@localhost:55432/doctyn \
#     S3_ENDPOINT=http://localhost:59000 S3_BUCKET=doctyn S3_ACCESS_KEY_ID=minioadmin S3_SECRET_ACCESS_KEY=minioadmin \
#     S3_FORCE_PATH_STYLE=true S3_REGION=us-east-1 TTS_PROVIDER=windows npm run cloud:e2e
services:
  postgres:
    image: postgres:16
    environment: { POSTGRES_USER: doctyn, POSTGRES_PASSWORD: doctyn, POSTGRES_DB: doctyn }
    ports: ["55432:5432"]
  minio:
    image: minio/minio
    command: server /data --console-address ":59001"
    environment: { MINIO_ROOT_USER: minioadmin, MINIO_ROOT_PASSWORD: minioadmin }
    ports: ["59000:9000", "59001:59001"]
  minio-init:
    image: minio/mc
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "sleep 3; mc alias set local http://minio:9000 minioadmin minioadmin; mc mb -p local/doctyn; exit 0"
